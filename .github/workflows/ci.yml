name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          else
            git show --check --format=fuller "$HEAD_SHA"
          fi

      - name: Verify required files and sensitive paths
        shell: pwsh
        run: ./scripts/verify-project.ps1

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/information_hub_backend_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: information_hub_backend
      SPRING_DATASOURCE_PASSWORD: backend-tests-db-only
      SPRING_FLYWAY_ENABLED: "true"
      INFORMATION_HUB_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/information_hub_backend_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8
      INFORMATION_HUB_TEST_DB_USERNAME: information_hub_backend
      INFORMATION_HUB_TEST_DB_PASSWORD: backend-tests-db-only
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: information_hub_backend_test
          MYSQL_USER: information_hub_backend
          MYSQL_PASSWORD: backend-tests-db-only
          MYSQL_ROOT_PASSWORD: backend-tests-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbackend-tests-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend/information-hub
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/information-hub/pom.xml

      - name: Verify backend datasource environment
        shell: bash
        run: |
          set -euo pipefail
          : "${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}"
          : "${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}"
          : "${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}"
          case "$SPRING_DATASOURCE_URL" in
            jdbc:mysql://127.0.0.1:3306/information_hub_backend_test\?*) ;;
            *)
              echo "Backend datasource preflight failed: expected the job-local MySQL service on 127.0.0.1:3306."
              exit 1
              ;;
          esac
          echo "Backend datasource preflight passed: URL is set; host=127.0.0.1; port=3306; database=information_hub_backend_test."

      - name: Run Maven tests
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw test

  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/boss-zhipin-scraper
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            collectors/boss-zhipin-scraper/requirements.txt
            collectors/boss-zhipin-scraper/pyproject.toml

      - name: Install Collector dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Collector tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/information-hub-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/information-hub-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/information-hub-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run type checks
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

  phase3-e2e:
    name: Phase 3 full-stack E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: information_hub_e2e_test
          MYSQL_USER: information_hub_e2e
          MYSQL_PASSWORD: phase3-e2e-db-only
          MYSQL_ROOT_PASSWORD: phase3-e2e-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pphase3-e2e-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/information-hub/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/information-hub-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/information-hub-web/package-lock.json

      - name: Build backend executable JAR
        working-directory: backend/information-hub
        run: |
          chmod +x ./mvnw
          ./mvnw -DskipTests package

      - name: Install frontend dependencies and Chromium
        working-directory: frontend/information-hub-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run real Web/backend E2E with local Fake Provider
        working-directory: frontend/information-hub-web
        env:
          INFORMATION_HUB_E2E_DB_URL: jdbc:mysql://127.0.0.1:3306/information_hub_e2e_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8
          INFORMATION_HUB_E2E_DB_USERNAME: information_hub_e2e
          INFORMATION_HUB_E2E_DB_PASSWORD: phase3-e2e-db-only
          INFORMATION_HUB_E2E_USERNAME: phase3-e2e
          INFORMATION_HUB_E2E_PASSWORD: phase3-e2e-login-only
          INFORMATION_HUB_E2E_COLLECTOR_TOKEN: phase3-e2e-collector-only
          INFORMATION_HUB_E2E_PREVIEW_HMAC_SECRET: phase3-e2e-preview-hmac-secret-32-bytes-minimum
        run: |
          npm run test:e2e:phase3
  web-deployment:
    name: Web deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate web deployment configuration
        shell: pwsh
        run: ./deploy/web/tests/validate-web-compose.ps1

      - name: Build web image
        run: docker compose --env-file deploy/.env.example --file deploy/docker-compose.yml --profile web build web

      - name: Validate Nginx configuration
        run: docker compose --env-file deploy/.env.example --file deploy/docker-compose.yml --profile web run --rm --no-deps web nginx -t

      - name: Start web container
        run: docker compose --env-file deploy/.env.example --file deploy/docker-compose.yml --profile web up -d --no-deps web

      - name: Verify health and SPA deep-route fallback
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep --quiet '^ok$'; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker compose --env-file deploy/.env.example --file deploy/docker-compose.yml --profile web logs web
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/jobs/7/snapshots | grep --quiet '<div id="app"></div>'

      - name: Stop test container
        if: always()
        run: docker compose --env-file deploy/.env.example --file deploy/docker-compose.yml --profile web down
